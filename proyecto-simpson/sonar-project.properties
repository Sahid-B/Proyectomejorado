# =============================================
# Configuración SonarQube - Proyecto Simpson
# =============================================

sonar.projectKey=Proyecto-PICW
sonar.projectName=Proyecto-PICW
sonar.projectVersion=1.0

# Ruta al código fuente
sonar.sources=src

# Exclusiones (no analizar dependencias ni tests)
sonar.exclusions=node_modules/**,coverage/**,dist/**,**/__mocks__/**,**/*.test.jsx,**/*.test.js,**/*.spec.jsx,**/*.spec.js

# Tests (para cobertura)
sonar.tests=src
sonar.test.inclusions=**/*.test.jsx,**/*.test.js,**/*.spec.jsx,**/*.spec.js

# Cobertura (si tienes lcov)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# URL del servidor SonarQube local
sonar.host.url=http://localhost:9000

